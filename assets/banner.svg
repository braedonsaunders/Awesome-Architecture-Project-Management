<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      text-anchor: middle;
    }
    
    /* Dynamic Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-glow {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .animated-float {
      animation: float 5s ease-in-out infinite;
    }
    .animated-line {
      stroke-dasharray: 8, 8;
      animation: dash 3s linear infinite;
    }
  </style>

  <!-- Background Rect -->
  <rect width="900" height="220" rx="12" fill="url(#bgGrad)" />
  <rect width="900" height="220" rx="12" fill="url(#grid)" />

  <!-- Dynamic Architectural Blueprint Lines in Background (Low Opacity) -->
  <g opacity="0.25">
    <circle cx="750" cy="110" r="80" fill="none" stroke="#38bdf8" stroke-width="1.5" class="animated-glow" />
    <circle cx="750" cy="110" r="110" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" />
    <path d="M 600 180 L 750 30 L 850 180 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="550" y1="180" x2="880" y2="180" stroke="#94a3b8" stroke-width="1" class="animated-line" />
  </g>

  <!-- Glowing Accent Bar -->
  <rect x="40" y="38" width="6" height="144" rx="3" fill="url(#accentGrad)" />

  <!-- Main Foreground Content (Layered over background elements) -->
  <g transform="translate(60, 0)">
    <!-- Category Tag -->
    <rect x="0" y="42" width="220" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="110" y="59" class="badge-text">ARCHITECTURE &amp; ENGINEERING</text>

    <!-- Main Title -->
    <text x="0" y="108" class="title">Awesome Architecture Project Management</text>

    <!-- Subtitle -->
    <text x="0" y="142" class="subtitle">A curated guide to A/E firm ERP, phase-based budgeting, time &amp; billing, and open-source tools.</text>

    <!-- Bottom Decorative Line -->
    <line x1="0" y1="172" x2="480" y2="172" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
